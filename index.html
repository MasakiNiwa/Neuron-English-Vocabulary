<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="語源や意味のつながりで辿る英単語アプリ" />
    <meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>ニューロン英単語</title>
    <script>
      // テーマのちらつき防止（React 起動前に適用）
      try {
        var s = JSON.parse(localStorage.getItem('nev-settings') || '{}').state || {}
        var m = s.theme || 'system'
        var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- アクセス数の計測（GoatCounter）。Cookie なし。自動計測はオフにして、アプリ側で画面の種類だけを送る（src/lib/goatcounter.ts） -->
    <script
      data-goatcounter="https://masaki28.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
