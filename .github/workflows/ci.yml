name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: python3 scripts/data/06_lint.py
      - run: python3 -m unittest discover -s scripts/data -p 'test_*.py' -v
      - run: python3 scripts/data/09_verify_after_fixes.py
